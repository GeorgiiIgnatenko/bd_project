# Local maintenance requires an OS identity inside the database container.
local all all peer map=container_admin
# Bootstrap is never a network/application login, even with its correct password.
host all news_bootstrap 0.0.0.0/0 reject
host all news_bootstrap ::/0 reject
host all news_setup 0.0.0.0/0 reject
host all news_setup ::/0 reject
host all all 0.0.0.0/0 scram-sha-256
host all all ::/0 scram-sha-256
