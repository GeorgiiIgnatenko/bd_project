# Override for an ISOLATED project; use python3 -m scripts.recovery.
services:
  postgres:
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Run python3 security/init_env.py}
    command:
      - postgres
      - -c
      - timezone=Asia/Novosibirsk
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - hba_file=/workspace/recovery/pg_hba.conf
      - -c
      - ident_file=/workspace/security/pg_ident.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - wal_keep_size=64MB

  replica:
    image: postgres:18
    profiles: [recovery]
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${POSTGRES_DB:-news_aggregator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Run python3 security/init_env.py}
    entrypoint: [sh, /workspace/recovery/replica.sh]
    command: [postgres, -c, timezone=Asia/Novosibirsk, -c, shared_preload_libraries=pg_stat_statements, -c, hba_file=/workspace/security/pg_hba.conf, -c, ident_file=/workspace/security/pg_ident.conf, -c, hot_standby=on]
    volumes:
      - replica_data:/var/lib/postgresql
      - ./recovery:/workspace/recovery:ro
      - ./security:/workspace/security:ro
    healthcheck:
      test: [CMD-SHELL, 'psql -X -w -U news_bootstrap -d "$$POSTGRES_DB" -Atc "SELECT pg_is_in_recovery()" | grep -qx t']
      interval: 2s
      timeout: 3s
      retries: 40

  restore:
    image: postgres:18
    profiles: [recovery]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_aggregator}
      POSTGRES_USER: news_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh start.sh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run sh start.sh}
      APP_PASSWORD: ${APP_PASSWORD:?Run sh start.sh}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Run sh start.sh}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    command: [postgres, -c, timezone=Asia/Novosibirsk, -c, shared_preload_libraries=pg_stat_statements, -c, hba_file=/workspace/security/pg_hba.conf, -c, ident_file=/workspace/security/pg_ident.conf]
    volumes:
      - restore_data:/var/lib/postgresql
      - .:/workspace:ro
      - ./docker/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U news_admin -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    volumes:
      - ./recovery:/workspace/recovery:ro

volumes:
  replica_data:
  restore_data:
